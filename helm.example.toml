# Copiez ce fichier vers `helm.toml`, ou désignez-le avec HELM_CONFIG.
# Les sections optionnelles sont commentées. HELM_BIND et HELM_DB priment sur ce fichier.

# Adresse d'écoute. Les agents et GitHub exigent une adresse loopback.
bind = "127.0.0.1:7878"

# Base SQLite créée au premier démarrage, en mode WAL.
db_path = "helm.db"

# Sans `project.repo`, le tableau fonctionne sans assignation d'agent.
# Les chemins du dépôt et des worktrees sont absolus ou commencent par ~/.
# [project]
# repo = "~/code/my-project"
# worktree_root = "~/.local/share/helm/worktrees" # <racine>/<CLÉ>-<n> par carte
#
# [agents]
# max_concurrent = 2
# run_timeout_minutes = 60 # limite de l'agent, distincte de celle des vérifications
#
# [agents.claude]
# command = "claude" # exécutable trouvé dans PATH
# permission_mode = "bypassPermissions" # acceptEdits | auto | bypassPermissions | manual | dontAsk | plan
# model = "sonnet" # modèle des cartes qui n'en nomment pas

# Vérifications après l'agent, avant le push, dans le worktree de la carte.
# Chaque chaîne passe à sh -c, avec les droits de Helm. Adaptez ces commandes au projet.
# Un échec bloque le push. Aucune commande signifie « Non exécutées ».
# [checks]
# commands = [
#     "cargo fmt --check",
#     "cargo clippy --all-targets --locked -- -D warnings",
#     "cargo test --locked",
# ]
# timeout_minutes = 10 # par commande, entier strictement positif

# Sans cette section, Helm n'ouvre pas de PR.
# Installez gh et authentifiez-le sur github.com avant de l'activer.
# Le dépôt doit correspondre au remote origin de project.repo.
# [github]
# repository = "owner/repo"
# command = "gh" # défaut : gh dans PATH ; un chemin d'exécutable est aussi accepté
